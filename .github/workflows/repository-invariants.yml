name: Repository invariants

on:
  push:
  pull_request:

jobs:
  prisoner-mercy-threshold:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify Prisoner/Mercy threshold lock
        run: python Tests/PrisonerMercy/test_threshold20_lock.py
